<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠폰 받기 - 대리입찰 톡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard','Malgun Gothic',sans-serif; background:linear-gradient(135deg,#eef3ff 0%,#f8fafc 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.2rem; color:#1e293b; }
        .coupon-card { background:#fff; border-radius:20px; box-shadow:0 12px 40px rgba(21,80,232,0.12); max-width:420px; width:100%; overflow:hidden; }
        .cc-head { background:linear-gradient(135deg,#1550E8,#2563eb); color:#fff; padding:1.6rem 1.5rem; text-align:center; position:relative; }
        .cc-head .logo { font-size:0.82rem; opacity:0.9; font-weight:600; letter-spacing:0.02em; }
        .cc-head h1 { font-size:1.35rem; margin-top:0.4rem; font-weight:800; }
        .cc-body { padding:1.6rem 1.5rem; }
        .cc-channel { display:inline-block; background:#e0edff; color:#1550E8; font-weight:700; font-size:0.82rem; padding:4px 12px; border-radius:20px; margin-bottom:0.9rem; }
        .cc-discount { font-size:2.1rem; font-weight:800; color:#1550E8; line-height:1.1; }
        .cc-discount small { font-size:1rem; font-weight:600; color:#64748b; }
        .cc-sub { color:#64748b; font-size:0.9rem; margin-top:0.5rem; line-height:1.5; }
        .cc-remaining { margin-top:0.8rem; font-size:0.82rem; color:#ef4444; font-weight:700; }
        .cc-btn { display:block; width:100%; margin-top:1.4rem; padding:0.95rem; border:none; border-radius:12px; background:#1550E8; color:#fff; font-size:1.02rem; font-weight:800; cursor:pointer; transition:background 0.2s; }
        .cc-btn:hover { background:#0f3fc0; }
        .cc-btn:disabled { background:#cbd5e1; cursor:not-allowed; }
        .cc-btn.sub { background:#fff; color:#1550E8; border:2px solid #1550E8; margin-top:0.6rem; }
        .cc-msg { margin-top:1rem; font-size:0.88rem; min-height:1.2rem; text-align:center; line-height:1.5; }
        .cc-note { margin-top:1.1rem; font-size:0.76rem; color:#94a3b8; line-height:1.5; border-top:1px dashed #e2e8f0; padding-top:0.9rem; }
        .spin { display:inline-block; }
        .hidden { display:none !important; }
    </style>
</head>
<body>
    <div class="coupon-card">
        <div class="cc-head">
            <div class="logo"><i class="fas fa-gavel"></i> 대리입찰 톡</div>
            <h1>🎟️ 할인 쿠폰</h1>
        </div>
        <div class="cc-body">
            <div id="loadingBox" style="text-align:center; padding:1.5rem 0; color:#94a3b8;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <div style="margin-top:0.8rem; font-size:0.9rem;">쿠폰 정보를 확인하는 중...</div>
            </div>

            <div id="offerBox" class="hidden">
                <span class="cc-channel" id="chChannel">채널</span>
                <div class="cc-discount" id="chDiscount">-</div>
                <div class="cc-sub" id="chSub">회원가입 후 첫 대리입찰 결제 시 사용할 수 있습니다.</div>
                <div class="cc-remaining" id="chRemaining"></div>
                <button class="cc-btn" id="claimBtn" onclick="onClaim()"><i class="fas fa-gift"></i> 쿠폰 받기</button>
                <div class="cc-msg" id="claimMsg"></div>
            </div>

            <div id="doneBox" class="hidden">
                <div style="text-align:center;">
                    <div style="font-size:2.6rem; color:#16a34a;"><i class="fas fa-circle-check"></i></div>
                    <div style="font-size:1.15rem; font-weight:800; margin-top:0.5rem;" id="doneTitle">쿠폰이 저장되었습니다!</div>
                    <div class="cc-sub" id="doneSub" style="margin-top:0.6rem;">마이페이지 &gt; 내 쿠폰함에서 확인할 수 있어요.</div>
                </div>
                <button class="cc-btn" onclick="location.href='apply.html'"><i class="fas fa-file-signature"></i> 지금 대리입찰 신청하기</button>
                <button class="cc-btn sub" onclick="location.href='mypage.html#coupons'"><i class="fas fa-user"></i> 마이페이지에서 쿠폰 보기</button>
            </div>

            <div id="errorBox" class="hidden">
                <div style="text-align:center; padding:0.5rem 0;">
                    <div style="font-size:2.4rem; color:#ef4444;"><i class="fas fa-circle-exclamation"></i></div>
                    <div class="cc-sub" id="errorMsg" style="margin-top:0.7rem; color:#ef4444; font-weight:600;">쿠폰을 사용할 수 없습니다.</div>
                </div>
                <button class="cc-btn sub" onclick="location.href='index.html'">홈으로</button>
            </div>

            <div class="cc-note">
                · 쿠폰은 <b>1인(휴대폰 번호) 1회</b>만 사용 가능하며, 코드 종류와 무관하게 중복 사용은 제한됩니다.<br>
                · 선착순 100명 한정 · <b>2026-10-30 마감</b> (이후 자동 만료).
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/localdb.js"></script>
    <script src="js/payment-config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const _params = new URLSearchParams(location.search);
        const COUPON_CODE = (_params.get('code') || _params.get('coupon') || '').trim();

        function show(boxId) {
            ['loadingBox','offerBox','doneBox','errorBox'].forEach(id => {
                document.getElementById(id).classList.toggle('hidden', id !== boxId);
            });
        }
        function showError(msg) {
            document.getElementById('errorMsg').textContent = msg || '쿠폰을 사용할 수 없습니다.';
            show('errorBox');
        }

        // 잔여 수량 실시간 갱신(오퍼 화면이 떠 있는 동안 15초마다)
        let _remainTimer = null;
        function startRemainingAutoRefresh() {
            if (_remainTimer) return;
            _remainTimer = setInterval(async () => {
                // 오퍼 화면이 아닐 때(발급완료/에러)는 중단
                if (document.getElementById('offerBox').classList.contains('hidden')) { clearInterval(_remainTimer); _remainTimer = null; return; }
                try {
                    const r = await _authPost('/coupon-validate', { code: COUPON_CODE });
                    const el = document.getElementById('chRemaining');
                    if (!el) return;
                    if (r && r.soldOut) {
                        el.textContent = '🚫 선착순 100명 마감';
                        const btn = document.getElementById('claimBtn');
                        if (btn) { btn.disabled = true; btn.innerHTML = '마감되었습니다'; }
                        clearInterval(_remainTimer); _remainTimer = null;
                    } else if (r && typeof r.remaining === 'number') {
                        el.textContent = '⏳ 선착순 잔여 ' + r.remaining + '명';
                    }
                } catch (e) {}
            }, 15000);
        }

        async function initCoupon() {
            if (!COUPON_CODE) { showError('쿠폰 코드가 없습니다. 배너를 다시 눌러주세요.'); return; }
            try {
                const r = await _authPost('/coupon-validate', { code: COUPON_CODE });
                // 선착순 마감 → 오퍼는 보여주되 받기 비활성화
                if (r && r.soldOut) {
                    document.getElementById('chChannel').textContent = (r.channel || '') + ' 채널';
                    document.getElementById('chDiscount').innerHTML = '<span style="color:#ef4444;">마감</span>';
                    document.getElementById('chRemaining').textContent = '🚫 선착순 100명 마감';
                    const btn = document.getElementById('claimBtn');
                    btn.disabled = true; btn.innerHTML = '마감되었습니다';
                    show('offerBox');
                    return;
                }
                if (!r || !r.valid) { showError((r && r.message) || '유효하지 않은 쿠폰입니다.'); return; }
                document.getElementById('chChannel').textContent = r.channel + ' 채널';
                document.getElementById('chDiscount').innerHTML = r.free
                    ? '1회 <small>완전 무료</small>'
                    : (r.discount || 0).toLocaleString('ko-KR') + '원 <small>할인</small>';
                if (typeof r.remaining === 'number') {
                    document.getElementById('chRemaining').textContent = '⏳ 선착순 잔여 ' + r.remaining + '명';
                }
                show('offerBox');
                startRemainingAutoRefresh(); // 잔여 실시간 갱신

                // 로그인 상태에서 배너를 통해 돌아온 경우(대기 쿠폰) 자동 발급
                const pending = localStorage.getItem('pending_coupon');
                if (pending === COUPON_CODE && hasValidLogin()) {
                    localStorage.removeItem('pending_coupon');
                    await doClaim();
                }
            } catch (e) {
                showError('쿠폰 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
            }
        }

        // 워커 주소 (payment-config.js의 AUTH_CONFIG, 없으면 기본값)
        const WORKER = (window.AUTH_CONFIG && window.AUTH_CONFIG.workerUrl) || 'https://bidtok-auth-proxy.qkqk5342.workers.dev';

        function hasValidLogin() {
            // localStorage에 로그인 정보 + 세션 토큰이 둘 다 있어야 '진짜 로그인'으로 취급
            try { return Auth.isLoggedIn() && !!_session(); } catch (e) { return false; }
        }
        function clearStaleLogin() {
            try { localStorage.removeItem('currentUser'); localStorage.removeItem('bidtok_session'); localStorage.removeItem('autoLogin'); } catch (e) {}
        }
        function goLogin() {
            // 쿠폰 코드를 기억 → 로그인 후 이 페이지로 복귀 → 자동 발급
            try { localStorage.setItem('pending_coupon', COUPON_CODE); } catch (e) {}
            location.href = 'login.html?redirect=' + encodeURIComponent('coupon.html?code=' + COUPON_CODE);
        }

        function onClaim() {
            if (!hasValidLogin()) { goLogin(); return; }
            doClaim();
        }

        async function doClaim() {
            const btn = document.getElementById('claimBtn');
            const msg = document.getElementById('claimMsg');
            btn.disabled = true;
            msg.style.color = '#64748b';
            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 쿠폰 받는 중...';
            try {
                // _authPost 대신 직접 호출 — 401/세션문제를 우리가 직접 처리(로그인 후 자동 재발급)
                const res = await fetch(WORKER + '/coupon-claim', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session: _session(), code: COUPON_CODE })
                });
                const r = await res.json().catch(() => ({}));

                // 세션 만료/무효 또는 회원정보 없음 → 로그인 화면으로(로그인하면 자동 발급)
                if (res.status === 401 || (r && /로그인|회원 정보를 찾을 수 없/.test(r.message || ''))) {
                    clearStaleLogin();
                    goLogin();
                    return;
                }

                if (r && r.success) {
                    const ch = r.channel || '';
                    document.getElementById('doneTitle').textContent = r.already ? '이미 받은 쿠폰이 있어요' : (ch + ' 쿠폰을 받았습니다!');
                    document.getElementById('doneSub').textContent = r.already
                        ? '마이페이지 > 내 쿠폰함에서 확인 후 결제 시 적용하세요.'
                        : '마이페이지 > 내 쿠폰함에 저장되었습니다. 결제 시 적용하세요.';
                    show('doneBox');
                } else {
                    btn.disabled = false;
                    msg.style.color = '#ef4444';
                    msg.textContent = '❌ ' + ((r && r.message) || '쿠폰을 받을 수 없습니다.');
                }
            } catch (e) {
                btn.disabled = false;
                msg.style.color = '#ef4444';
                msg.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
            }
        }

        document.addEventListener('DOMContentLoaded', initCoupon);
    </script>
</body>
</html>
